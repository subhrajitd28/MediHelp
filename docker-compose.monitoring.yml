# Self-hosted observability stack — replaces the expired Grafana Cloud trial.
#
# Usage on the VM:
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Then open:
#   http://<VM_IP>:9090   Prometheus   (raw metrics + targets list)
#   http://<VM_IP>:3000   Grafana      (login: admin / GRAFANA_PASSWORD env, default: admin)
#
# Network mode "host" lets Prometheus scrape Java services on localhost:808x
# without weaving each one into a docker network. Linux-only — fine for the
# Azure VM which is Ubuntu.

services:
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: medihelp-prometheus
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.listen-address=:9090'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:10.4.2
    container_name: medihelp-grafana
    restart: unless-stopped
    network_mode: host
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED:  "false"
      GF_SERVER_HTTP_PORT:        "3000"

volumes:
  prometheus-data:
  grafana-data:
